name: OSI V2 Report-Write Function Deploy

# Manual-only deployment of the osi-v2-report-write Edge Function to the pinned
# production project, followed by an anonymous deny-by-default smoke test.
#
# Every earlier production workflow pins itself to the exact migration count of
# the slice it shipped, which is correct for a one-shot rollout but means none
# of them can deploy this function again. This one pins to current origin/main
# instead, so it stays usable as the Report-write surface evolves.
#
# SAFETY CONTRACT:
#   * workflow_dispatch ONLY, and only from main.
#   * Typed confirmation required; SUPABASE_PROJECT_ID must equal the pinned
#     ref or the run aborts before any deploy.
#   * Deploys EXACTLY one function (osi-v2-report-write) from current main.
#     No database migration, no db push, no other function, no Vercel action,
#     no feature-flag change, no secret change.
#   * verify_jwt=false is passed explicitly and matches the existing deployed
#     configuration: the function performs its own strict authorization
#     (server-issued single-use nonces, Ed25519 signature verification,
#     confirmed mainnet Memo inspection, and a maintainer double-gate that
#     validates its Supabase JWT in-function).
#   * The smoke test is anonymous and read-only in effect: it asserts that
#     unauthorized and malformed requests are refused. It submits no signed
#     commit and no transaction.
#   * Secrets are never printed.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-REPORT-WRITE-afibxpniwfnavdobecrn to authorize'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: osi-v2-report-write-function-deploy
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: afibxpniwfnavdobecrn
  FUNCTION_SLUG: osi-v2-report-write

jobs:
  deploy:
    name: Deploy the Report-write function and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID_SECRET: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Require exact confirmation and current main
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY-REPORT-WRITE-${EXPECTED_PROJECT_REF}" ]; then
            echo "::error::Confirmation phrase mismatch."
            exit 1
          fi
          [ "${GITHUB_REF}" = "refs/heads/main" ] || {
            echo "::error::Production deployment must be dispatched from main."; exit 1;
          }

      - name: Check out the dispatched commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify the dispatched commit is current origin/main
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo "::error::Dispatched commit is not current origin/main."; exit 1;
          }
          echo "Deploying $(git rev-parse --short HEAD) from main."

      - name: Verify secrets, pinned project ref and deploy source
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::SUPABASE_ACCESS_TOKEN ABSENT."; exit 1; }
          [ "$PROJECT_ID_SECRET" = "$EXPECTED_PROJECT_REF" ] || {
            echo "::error::SUPABASE_PROJECT_ID does not match the pinned ref."; exit 1;
          }
          [ -f "supabase/functions/${FUNCTION_SLUG}/index.ts" ] || {
            echo "::error::Function source missing: ${FUNCTION_SLUG}."; exit 1;
          }
          for shared in osi-v2-proof-core.mjs osi-v2-report-core.mjs \
                        osi-v2-case-write-core.mjs osi-v2-event-registry.mjs \
                        osi-v2-sas-core.mjs osi-v2-sas-onchain.ts; do
            [ -f "supabase/functions/_shared/${shared}" ] || {
              echo "::error::Shared dependency missing: ${shared}."; exit 1;
            }
          done

      - name: Set up Deno
        uses: denoland/setup-deno@909cc5acb0fdd60627fb858598759246509fa755 # v2.0.2
        with:
          deno-version: v2.4.1

      - name: Type-check the function before deploying it
        run: deno check "supabase/functions/${FUNCTION_SLUG}/index.ts"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Deploy exactly the Report-write function
        run: |
          set -euo pipefail
          supabase functions deploy "$FUNCTION_SLUG" \
            --project-ref "$EXPECTED_PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Anonymous deny-by-default smoke test
        run: |
          set -euo pipefail
          base="https://${EXPECTED_PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_SLUG}"

          echo "== unknown op (expect 400 bad_op) =="
          code="$(curl -sS --max-time 30 -o /tmp/resp.json -w '%{http_code}' -X POST "$base" \
            -H 'Content-Type: application/json' -d '{"op":"definitely_not_an_op"}')"
          cat /tmp/resp.json; echo
          [ "$code" = "400" ] || { echo "::error::expected 400 for unknown op, got $code"; exit 1; }

          echo "== prepare_rejection without a wallet (expect refusal, never 200) =="
          code="$(curl -sS --max-time 30 -o /tmp/resp.json -w '%{http_code}' -X POST "$base" \
            -H 'Content-Type: application/json' -d '{"op":"prepare_rejection"}')"
          cat /tmp/resp.json; echo
          [ "$code" != "200" ] || { echo "::error::prepare_rejection accepted an unauthenticated request"; exit 1; }
          grep -q '"ok":false' /tmp/resp.json || { echo "::error::prepare_rejection did not fail closed"; exit 1; }

          echo "== commit_rejection without a wallet (expect refusal, never 200) =="
          code="$(curl -sS --max-time 30 -o /tmp/resp.json -w '%{http_code}' -X POST "$base" \
            -H 'Content-Type: application/json' -d '{"op":"commit_rejection"}')"
          cat /tmp/resp.json; echo
          [ "$code" != "200" ] || { echo "::error::commit_rejection accepted an unauthenticated request"; exit 1; }
          grep -q '"ok":false' /tmp/resp.json || { echo "::error::commit_rejection did not fail closed"; exit 1; }

          echo "== capabilities for an unknown Case (expect ok:true, case_eligible:false) =="
          body="$(curl -sS --max-time 30 -X POST "$base" -H 'Content-Type: application/json' \
            -d '{"op":"capabilities","case_ref":"OSI-DOESNOTEXIST0"}')"
          echo "$body"
          echo "$body" | grep -q '"ok":true' || { echo "::error::capabilities failed"; exit 1; }
          echo "$body" | grep -q '"case_eligible":false' || {
            echo "::error::capabilities claimed an unknown Case is eligible"; exit 1;
          }

          echo "Smoke test passed: unknown op refused, both rejection ops fail closed, capabilities honest."
