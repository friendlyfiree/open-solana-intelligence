name: OSI V2 Wire Filter Hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/osi-v2-wire-filter-hotfix.yml"

permissions:
  contents: read

concurrency:
  group: osi-v2-wire-filter-hotfix-production
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: afibxpniwfnavdobecrn

jobs:
  deploy:
    name: Test and deploy Wire filter hotfix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID_SECRET: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify repository, branch, and project pin
        run: |
          set -euo pipefail
          [ "${GITHUB_REPOSITORY}" = "friendlyfiree/open-solana-intelligence" ]
          [ "${GITHUB_REF}" = "refs/heads/main" ]
          [ "${PROJECT_ID_SECRET}" = "${EXPECTED_PROJECT_REF}" ]
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Run exact Wire regression tests
        run: |
          set -euo pipefail
          node tests/osi-v2-wire-personal-data.test.mjs
          node tests/osi-v2-wire.test.mjs

      - name: Deploy only the Wire Edge Function
        run: |
          set -euo pipefail
          supabase functions deploy osi-v2-wire \
            --project-ref "${EXPECTED_PROJECT_REF}" \
            --no-verify-jwt \
            --use-api
          supabase functions list --project-ref "${EXPECTED_PROJECT_REF}" | grep -q 'osi-v2-wire'
