name: OSI V2 Wallet Profiles Production

# Adds owner-controlled wallet profiles without backfilling users or changing
# analyst/maintainer authority. The new write path stays disabled until schema,
# Edge and anonymous/negative smoke checks pass in this workflow.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY-WALLET-PROFILES-afibxpniwfnavdobecrn to authorize"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: osi-v2-wallet-profiles-production
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: afibxpniwfnavdobecrn
  SLICE_MIGRATION: 20260808163737_osi_v2_wallet_profiles.sql
  SLICE_VERSION: "20260808163737"
  PROFILE_FUNCTION: osi-v2-profile
  CASE_READ_FUNCTION: osi-v2-case-read
  PROFILE_FLAG: OSI_V2_PROFILE_WRITES_ENABLED
  OSI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  validate:
    name: Clean profile validation from zero
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require exact confirmation and current main
        env:
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM_INPUT" = "DEPLOY-WALLET-PROFILES-${EXPECTED_PROJECT_REF}" ] || {
            echo "::error::Confirmation phrase mismatch."; exit 1;
          }
          [ "${GITHUB_REF}" = "refs/heads/main" ] || {
            echo "::error::Production deployment must be dispatched from main."; exit 1;
          }

      - name: Check out the dispatched commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify current main and exact slice files
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo "::error::Dispatched commit is not current origin/main."; exit 1;
          }
          test -f "supabase/migrations/${SLICE_MIGRATION}"
          test -f "supabase/functions/${PROFILE_FUNCTION}/index.ts"
          test -f "supabase/functions/${CASE_READ_FUNCTION}/index.ts"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Deno
        uses: denoland/setup-deno@909cc5acb0fdd60627fb858598759246509fa755 # v2.0.2
        with:
          deno-version: v2.4.1

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.113.0

      - name: Full dependency-free battery and type checks
        run: |
          set -euo pipefail
          for test in tests/*.test.js tests/*.test.mjs; do node "$test"; done
          deno check "supabase/functions/${PROFILE_FUNCTION}/index.ts"
          deno check "supabase/functions/${CASE_READ_FUNCTION}/index.ts"

      - name: Start disposable PostgreSQL 17 and migrate from zero
        run: |
          set -euo pipefail
          supabase db start
          supabase db reset --local --no-seed

      - name: Database lint, pgTAP and replay tests
        run: |
          set -euo pipefail
          supabase db lint --local --level error
          supabase test db
          bash tests/osi-v2-concurrency.test.sh

      - name: Prove the profile database boundary
        run: |
          set -euo pipefail
          psql "$OSI_TEST_DATABASE_URL" -Atq <<'SQL' > /tmp/profile-contract.txt
          begin read only;
          select 'flag|' || value from public.osi_config where key='OSI_V2_PROFILE_WRITES_ENABLED';
          select 'forced_rls|' || (relrowsecurity and relforcerowsecurity)::text
            from pg_class where oid='public.wallet_profiles'::regclass;
          select 'anon_select|' || has_table_privilege('anon','public.wallet_profiles','SELECT')::text;
          select 'authenticated_update|' || has_table_privilege('authenticated','public.wallet_profiles','UPDATE')::text;
          select 'service_update|' || has_table_privilege('service_role','public.wallet_profiles','UPDATE')::text;
          select 'anon_commit|' || has_function_privilege('anon',
            'public.osi_v2_commit_wallet_profile_update(text,text,text,text,text,text,text,boolean,text,text,text,text)','EXECUTE')::text;
          select 'profile_rows|' || count(*) from public.wallet_profiles;
          commit;
          SQL
          cat /tmp/profile-contract.txt
          grep -q '^flag|false$' /tmp/profile-contract.txt
          grep -q '^forced_rls|true$' /tmp/profile-contract.txt
          grep -q '^anon_select|false$' /tmp/profile-contract.txt
          grep -q '^authenticated_update|false$' /tmp/profile-contract.txt
          grep -q '^service_update|true$' /tmp/profile-contract.txt
          grep -q '^anon_commit|false$' /tmp/profile-contract.txt
          grep -q '^profile_rows|0$' /tmp/profile-contract.txt

      - name: Stop and discard the disposable database
        if: always()
        run: supabase stop --no-backup

  rollout:
    name: Apply one migration and deploy two functions
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID_SECRET: ${{ secrets.SUPABASE_PROJECT_ID }}
      PGSSLMODE: require
    steps:
      - name: Check out the exact validated main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify credentials, project and current main
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is absent."; exit 1; }
          [ -n "${SUPABASE_DB_PASSWORD:-}" ] || { echo "::error::SUPABASE_DB_PASSWORD is absent."; exit 1; }
          [ "$PROJECT_ID_SECRET" = "$EXPECTED_PROJECT_REF" ] || { echo "::error::Pinned project mismatch."; exit 1; }
          git fetch origin main --quiet
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo "::error::Validated commit is no longer current main."; exit 1;
          }

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.113.0

      - name: Resolve pinned session-pooler coordinates
        run: |
          set -euo pipefail
          response="$(curl -sS --fail --max-time 30 -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "https://api.supabase.com/v1/projects/${EXPECTED_PROJECT_REF}/config/database/pooler")"
          coordinates="$(printf '%s' "$response" | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          rows = data if isinstance(data, list) else [data]
          primary = next((r for r in rows if str(r.get("database_type", "")).upper() == "PRIMARY"), rows[0])
          print(primary["db_host"], primary["db_port"], primary["db_user"], primary.get("db_name", "postgres"))
          ')"
          read -r PGHOST PGPORT PGUSER PGDATABASE <<< "$coordinates"
          case "$PGHOST" in *.pooler.supabase.com) : ;; *) echo "::error::Unexpected pooler host."; exit 1 ;; esac
          [ "$PGUSER" = "postgres.${EXPECTED_PROJECT_REF}" ] || { echo "::error::Unexpected pooler user."; exit 1; }
          { echo "PGHOST=$PGHOST"; echo "PGPORT=$PGPORT"; echo "PGUSER=$PGUSER"; echo "PGDATABASE=$PGDATABASE"; } >> "$GITHUB_ENV"

      - name: Record immutable pre-rollout counts
        run: |
          set -euo pipefail
          analyst_count="$(psql -Atqc 'select count(*) from public.analyst_profiles')"
          echo "ANALYST_COUNT_BEFORE=$analyst_count" >> "$GITHUB_ENV"
          [ "$(psql -Atqc "select count(*) from storage.buckets where id='osi-profile-avatars'")" = "0" ] || {
            echo "::error::The profile avatar bucket already exists; refusing to adopt or expose unknown objects."; exit 1;
          }
          [ "$(psql -Atqc "select count(*) from public.osi_config where key in ('OSI_V2_PROFILE_WRITES_ENABLED','OSI_V2_PROFILE_AVATAR_ORIGIN')")" = "0" ] || {
            echo "::error::Profile configuration already exists without the reviewed migration history."; exit 1;
          }

      - name: Dry-run and prove this is the only pending migration
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_PROJECT_REF"
          [ "$(cat supabase/.temp/project-ref)" = "$EXPECTED_PROJECT_REF" ]
          remote="$(psql -Atqc "select coalesce(string_agg(version, ' ' order by version), '') from supabase_migrations.schema_migrations")"
          local_all="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | sed -E 's/^([0-9]{14}).*/\1/' | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          expected_remote="$(printf '%s' "$local_all" | sed -E "s/(^| )${SLICE_VERSION}( |$)/\1/" | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//')"
          [ "$remote" = "$expected_remote" ] || {
            echo "::error::Production history is not current main minus exactly this slice."; exit 1;
          }
          supabase db push --linked --dry-run 2>&1 | tee /tmp/dry-run.txt
          grep -q "$SLICE_MIGRATION" /tmp/dry-run.txt || { echo "::error::Dry-run does not list this slice."; exit 1; }
          count="$(grep -oE '[0-9]{14}_[A-Za-z0-9_]+\.sql' /tmp/dry-run.txt | sort -u | wc -l | tr -d '[:space:]')"
          [ "$count" = "1" ] || { echo "::error::Dry-run lists ${count} pending migrations; exactly one is allowed."; exit 1; }

      - name: Apply exactly the wallet-profile migration
        run: |
          set -euo pipefail
          supabase db push --linked
          [ "$(psql -Atqc "select count(*) from supabase_migrations.schema_migrations where version='${SLICE_VERSION}'")" = "1" ]

      - name: Verify production migration did not backfill or change analyst authority
        run: |
          set -euo pipefail
          psql -Atq <<'SQL' > /tmp/production-profile-contract.txt
          begin read only;
          select 'flag|' || value from public.osi_config where key='OSI_V2_PROFILE_WRITES_ENABLED';
          select 'forced_rls|' || (relrowsecurity and relforcerowsecurity)::text
            from pg_class where oid='public.wallet_profiles'::regclass;
          select 'anon_select|' || has_table_privilege('anon','public.wallet_profiles','SELECT')::text;
          select 'authenticated_update|' || has_table_privilege('authenticated','public.wallet_profiles','UPDATE')::text;
          select 'profile_rows|' || count(*) from public.wallet_profiles;
          select 'analyst_rows|' || count(*) from public.analyst_profiles;
          commit;
          SQL
          cat /tmp/production-profile-contract.txt
          grep -q '^flag|false$' /tmp/production-profile-contract.txt
          grep -q '^forced_rls|true$' /tmp/production-profile-contract.txt
          grep -q '^anon_select|false$' /tmp/production-profile-contract.txt
          grep -q '^authenticated_update|false$' /tmp/production-profile-contract.txt
          grep -q '^profile_rows|0$' /tmp/production-profile-contract.txt
          grep -q "^analyst_rows|${ANALYST_COUNT_BEFORE}$" /tmp/production-profile-contract.txt

      - name: Snapshot the production Function inventory
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$EXPECTED_PROJECT_REF" -o json > /tmp/functions-before.json
          jq '[.[] | select(.slug!="osi-v2-profile" and .slug!="osi-v2-case-read") | {slug,version,status,verify_jwt,updated_at}] | sort_by(.slug)' /tmp/functions-before.json > /tmp/non-task-before.json
          jq -e '.[] | select(.slug=="osi-v2-case-read")' /tmp/functions-before.json > /tmp/case-read-before.json
          [ "$(jq '[.[] | select(.slug=="osi-v2-profile")] | length' /tmp/functions-before.json)" = "0" ] || {
            echo "::error::The new profile Function already exists outside this reviewed rollout."; exit 1;
          }

      - name: Deploy exactly the profile and Case-read functions
        run: |
          set -euo pipefail
          supabase functions deploy "$PROFILE_FUNCTION" --project-ref "$EXPECTED_PROJECT_REF" --no-verify-jwt --use-api
          supabase functions deploy "$CASE_READ_FUNCTION" --project-ref "$EXPECTED_PROJECT_REF" --no-verify-jwt --use-api

      - name: Prove only the two reviewed Functions changed and are active
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$EXPECTED_PROJECT_REF" -o json > /tmp/functions-after.json
          jq '[.[] | select(.slug!="osi-v2-profile" and .slug!="osi-v2-case-read") | {slug,version,status,verify_jwt,updated_at}] | sort_by(.slug)' /tmp/functions-after.json > /tmp/non-task-after.json
          diff -u /tmp/non-task-before.json /tmp/non-task-after.json
          jq -e '.[] | select(.slug=="osi-v2-profile" and .status=="ACTIVE" and .verify_jwt==false)' /tmp/functions-after.json > /dev/null
          jq -e '.[] | select(.slug=="osi-v2-case-read" and .status=="ACTIVE" and .verify_jwt==false)' /tmp/functions-after.json > /dev/null
          before="$(jq -r '.version' /tmp/case-read-before.json)"
          after="$(jq -r '.[] | select(.slug=="osi-v2-case-read") | .version' /tmp/functions-after.json)"
          [ "$after" -gt "$before" ] || { echo "::error::Case-read Function version did not advance."; exit 1; }

      - name: Smoke reads and fail-closed writes before enable
        run: |
          set -euo pipefail
          key="$(sed -nE 's/.*OSI_SUPABASE_KEY = "([^"]+)".*/\1/p' assets/js/01-public-config.js)"
          [ -n "$key" ] || { echo "::error::Could not read publishable key."; exit 1; }
          echo "SMOKE_KEY=$key" >> "$GITHUB_ENV"
          profile_base="https://${EXPECTED_PROJECT_REF}.supabase.co/functions/v1/${PROFILE_FUNCTION}"
          post() { curl -sS --max-time 45 -X POST "$profile_base" -H 'Content-Type: application/json' -H "apikey: $key" -H "Authorization: Bearer $key" -d "$1"; }
          status="$(post '{"op":"rollout_status"}')"
          printf '%s' "$status" | python3 -c 'import json,sys; b=json.load(sys.stdin); assert b == {"ok":True,"profile_writes_enabled":False}'
          missing="$(post '{"op":"get_public_profile","public_ref":"OSI-PRF-0000000000000000"}')"
          printf '%s' "$missing" | python3 -c 'import json,sys; b=json.load(sys.stdin); assert b.get("ok") is False and b.get("error") == "profile_not_found"'
          locked="$(post '{"op":"get_my_profile","wallet":"11111111111111111111111111111111"}')"
          printf '%s' "$locked" | python3 -c 'import json,sys; b=json.load(sys.stdin); assert b.get("error") == "owner_session_required"'
          disabled="$(post '{"op":"prepare_profile_update","wallet":"bad"}')"
          printf '%s' "$disabled" | python3 -c 'import json,sys; b=json.load(sys.stdin); assert b.get("error") == "profile_writes_disabled_or_unavailable"'
          case_base="https://${EXPECTED_PROJECT_REF}.supabase.co/functions/v1/${CASE_READ_FUNCTION}"
          case_list="$(curl -sS --max-time 45 -X POST "$case_base" -H 'Content-Type: application/json' -H "apikey: $key" -H "Authorization: Bearer $key" -d '{"op":"list_public_cases"}')"
          printf '%s' "$case_list" > /tmp/public-cases.json
          python3 - <<'PY'
          import json
          body=json.load(open('/tmp/public-cases.json'))
          assert body.get('ok') is True and isinstance(body.get('cases'),list)
          allowed={'public_ref','handle','display_name','avatar_url'}
          for case in body['cases']:
              profile=case.get('submitter_profile')
              assert profile is None or (isinstance(profile,dict) and set(profile)==allowed)
              if isinstance(profile,dict):
                  assert not ({'wallet','id','bio','status','tier','weight'} & set(profile))
          PY
          first_ref="$(python3 -c "import json; rows=json.load(open('/tmp/public-cases.json')).get('cases',[]); print(rows[0].get('public_ref','') if rows else '')")"
          detail_ref="${first_ref:-OSI-000000}"
          case_detail="$(curl -sS --max-time 45 -X POST "$case_base" -H 'Content-Type: application/json' -H "apikey: $key" -H "Authorization: Bearer $key" -d "{\"op\":\"get_public_case\",\"public_ref\":\"${detail_ref}\"}")"
          printf '%s' "$case_detail" > /tmp/public-case-detail.json
          FIRST_REF="$first_ref" python3 - <<'PY'
          import json,os
          body=json.load(open('/tmp/public-case-detail.json'))
          if not os.environ.get('FIRST_REF'):
              assert body.get('error') == 'not_found_or_private'
          else:
              assert body.get('ok') is True and isinstance(body.get('case'),dict)
              profile=body['case'].get('submitter_profile')
              allowed={'public_ref','handle','display_name','avatar_url'}
              assert profile is None or (isinstance(profile,dict) and set(profile)==allowed)
          PY

      - name: Enable only owner-controlled profile writes
        run: |
          set -euo pipefail
          updated="$(psql -v ON_ERROR_STOP=1 -Atqc "with changed as (update public.osi_config set value='true',updated_at=statement_timestamp() where key='${PROFILE_FLAG}' and value='false' returning 1) select count(*) from changed")"
          [ "$updated" = "1" ] || { echo "::error::Profile flag was not exactly false before enable."; exit 1; }
          [ "$(psql -Atqc "select value from public.osi_config where key='${PROFILE_FLAG}'")" = "true" ]

      - name: Smoke enabled gate without creating fake profile data
        run: |
          set -euo pipefail
          profile_base="https://${EXPECTED_PROJECT_REF}.supabase.co/functions/v1/${PROFILE_FUNCTION}"
          post() { curl -sS --max-time 45 -X POST "$profile_base" -H 'Content-Type: application/json' -H "apikey: $SMOKE_KEY" -H "Authorization: Bearer $SMOKE_KEY" -d "$1"; }
          status="$(post '{"op":"rollout_status"}')"
          printf '%s' "$status" | python3 -c 'import json,sys; b=json.load(sys.stdin); assert b == {"ok":True,"profile_writes_enabled":True}'
          rejected="$(post '{"op":"prepare_profile_update","wallet":"bad"}')"
          printf '%s' "$rejected" | python3 -c 'import json,sys; b=json.load(sys.stdin); assert b.get("ok") is False and b.get("error") != "profile_writes_disabled_or_unavailable"'
          [ "$(psql -Atqc "select count(*) from public.wallet_profiles where wallet='bad'")" = "0" ] || {
            echo "::error::The invalid negative smoke unexpectedly created data."; exit 1;
          }

      - name: Fail closed after any rollout or smoke failure
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          if [ -z "${PGHOST:-}" ] || [ -z "${PGUSER:-}" ]; then
            echo "No production database session was established; profile availability could not have been enabled by this job."
            exit 0
          fi
          current="$(psql -v ON_ERROR_STOP=1 -Atqc "select value from public.osi_config where key='${PROFILE_FLAG}'")"
          if [ -z "$current" ] || [ "$current" = "false" ]; then
            echo "Profile writes are absent or already disabled."
            exit 0
          fi
          psql -v ON_ERROR_STOP=1 -Atq -c "update public.osi_config set value='false',updated_at=statement_timestamp() where key='${PROFILE_FLAG}';"
          [ "$(psql -Atqc "select value from public.osi_config where key='${PROFILE_FLAG}'")" = "false" ] || {
            echo "::error::Profile writes could not be confirmed disabled."; exit 1;
          }
          echo "Profile writes were disabled; immutable profile receipts and rows remain retained for a forward fix."

      - name: Record rollout boundary
        if: always()
        run: |
          echo "This rollout adds one schema migration and deploys only osi-v2-profile plus osi-v2-case-read."
          echo "It creates no users, profiles, Cases, Reports, transactions or activity."
          echo "Rollback is a focused forward fix and disabling only OSI_V2_PROFILE_WRITES_ENABLED."
