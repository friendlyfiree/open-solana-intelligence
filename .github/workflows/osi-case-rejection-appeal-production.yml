name: OSI Case Rejection and Appeal Production

# Main-only additive rollout for normal Case rejection, owner appeal, and a
# fresh initial-review cycle. It applies exactly one migration, deploys exactly
# osi-v2-case-write, and contains only Case writes while production is checked.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CASE-REJECTION-APPEAL-afibxpniwfnavdobecrn to authorize'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: osi-case-rejection-appeal-production
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: afibxpniwfnavdobecrn
  PRODUCTION_WEB_URL: https://open-solana-intel.vercel.app
  FUNCTION_SLUG: osi-v2-case-write
  NEW_VERSION: '20260802180000'
  BEFORE_VERSIONS: >-
    20260711092711 20260711092852 20260711092856 20260711182949
    20260712002518 20260712121301 20260713045903 20260713184533
    20260714044036 20260714064501 20260714082218 20260715053828
    20260715112621 20260716063000 20260716120000 20260718120000
    20260718130000 20260718140000 20260725120000 20260725140000
    20260726173000 20260726185457 20260726200249 20260727170000
    20260727173000 20260728132011 20260728153100 20260728170000
    20260729134213 20260801092744 20260801120700 20260802102728
  AFTER_VERSIONS: >-
    20260711092711 20260711092852 20260711092856 20260711182949
    20260712002518 20260712121301 20260713045903 20260713184533
    20260714044036 20260714064501 20260714082218 20260715053828
    20260715112621 20260716063000 20260716120000 20260718120000
    20260718130000 20260718140000 20260725120000 20260725140000
    20260726173000 20260726185457 20260726200249 20260727170000
    20260727173000 20260728132011 20260728153100 20260728170000
    20260729134213 20260801092744 20260801120700 20260802102728
    20260802180000
  OSI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  validate:
    name: Full Case rejection and appeal proof
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Require exact confirmation and current main
        env:
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM_INPUT" = "CASE-REJECTION-APPEAL-${EXPECTED_PROJECT_REF}" ]
          [ "$GITHUB_REF" = 'refs/heads/main' ]

      - name: Check out the dispatched commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify exact current main and migration set
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]
          [ -z "$(git status --porcelain)" ]
          got="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | sed -E 's/^([0-9]{14}).*/\1/' | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          expected="$(echo "$AFTER_VERSIONS" | tr -s '[:space:]' ' ' | sed 's/^ //;s/ $//')"
          [ "$got" = "$expected" ]
          test -s "supabase/migrations/${NEW_VERSION}_osi_v2_case_initial_rejection_appeal.sql"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.4.1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.111.0

      - name: Application authorization workflow and browser tests
        run: |
          set -euo pipefail
          for test_file in tests/*.test.js tests/*.test.mjs; do node "$test_file"; done
          mapfile -t deno_sources < <(find supabase/functions -type f \( -path '*/index.ts' -o -path '*/_shared/*.ts' -o -path '*/_shared/*.mjs' \) | sort)
          deno check "${deno_sources[@]}"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/osi-case-rejection-appeal-production.yml
          npm install --no-save --no-package-lock @playwright/test@1.55.0 http-server@14.1.1
          npx playwright install --with-deps chromium
          npx playwright test --config tests/browser/playwright.config.js

      - name: PostgreSQL 17 migration from zero lint pgTAP and races
        run: |
          set -euo pipefail
          supabase db start
          supabase db reset --local --no-seed
          got="$(psql "$OSI_TEST_DATABASE_URL" -Atqc "select string_agg(version,' ' order by version) from supabase_migrations.schema_migrations")"
          expected="$(echo "$AFTER_VERSIONS" | tr -s '[:space:]' ' ' | sed 's/^ //;s/ $//')"
          [ "$got" = "$expected" ]
          supabase db lint --local --level error
          supabase test db
          bash tests/osi-v2-concurrency.test.sh

      - name: Stop and discard the disposable database
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: One migration one Case function and production smoke
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID_SECRET: ${{ secrets.SUPABASE_PROJECT_ID }}
      PGSSLMODE: require
      PROOF_DIR: /tmp/osi-case-rejection-appeal-proof
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.111.0

      - name: Verify credentials project secrets and unchanged main
        env:
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR"
          [ "$CONFIRM_INPUT" = "CASE-REJECTION-APPEAL-${EXPECTED_PROJECT_REF}" ]
          [ "$PROJECT_ID_SECRET" = "$EXPECTED_PROJECT_REF" ]
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]
          [ -n "${SUPABASE_DB_PASSWORD:-}" ]
          git fetch origin main --quiet
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]
          secret_names="$(supabase secrets list --project-ref "$EXPECTED_PROJECT_REF" --output json | jq -r '.[].name')"
          for required in SOLANA_RPC_URL OSI_V2_ALLOWED_ORIGIN OSI_MAINTAINER_AUTH_UUID; do grep -qx "$required" <<< "$secret_names"; done
          git rev-parse HEAD > "$PROOF_DIR/main-commit.txt"

      - name: Resolve pinned session pooler
        run: |
          set -euo pipefail
          response="$(curl -sS --fail --max-time 30 -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "https://api.supabase.com/v1/projects/${EXPECTED_PROJECT_REF}/config/database/pooler")"
          coordinates="$(printf '%s' "$response" | python3 -c '
          import json,sys
          data=json.load(sys.stdin); rows=data if isinstance(data,list) else [data]
          row=next((r for r in rows if str(r.get("database_type","")).upper()=="PRIMARY"),rows[0])
          print(row["db_host"],row["db_port"],row["db_user"],row.get("db_name","postgres"))
          ')"
          read -r PGHOST PGPORT PGUSER PGDATABASE <<< "$coordinates"
          case "$PGHOST" in *.pooler.supabase.com) :;; *) exit 1;; esac
          [ "$PGUSER" = "postgres.${EXPECTED_PROJECT_REF}" ]
          printf 'PGHOST=%s\nPGPORT=%s\nPGUSER=%s\nPGDATABASE=%s\n' "$PGHOST" "$PGPORT" "$PGUSER" "$PGDATABASE" >> "$GITHUB_ENV"

      - name: Link inspect history dry-run and snapshot protected state
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_PROJECT_REF"
          [ "$(cat supabase/.temp/project-ref)" = "$EXPECTED_PROJECT_REF" ]
          remote="$(psql -Atqc "select string_agg(version,' ' order by version) from supabase_migrations.schema_migrations")"
          before="$(echo "$BEFORE_VERSIONS" | tr -s '[:space:]' ' ' | sed 's/^ //;s/ $//')"
          after="$(echo "$AFTER_VERSIONS" | tr -s '[:space:]' ' ' | sed 's/^ //;s/ $//')"
          if [ "$remote" = "$before" ]; then echo 'ROLLOUT_MODE=deploy' >> "$GITHUB_ENV";
          elif [ "$remote" = "$after" ]; then echo 'ROLLOUT_MODE=resume' >> "$GITHUB_ENV";
          else echo '::error::Unexpected production migration history.'; exit 1; fi
          supabase migration list --linked > "$PROOF_DIR/migration-before.txt"
          supabase db push --linked --dry-run 2>&1 | tee "$PROOF_DIR/migration-dry-run.txt"
          pending="$(grep -oE '20[0-9]{12}' "$PROOF_DIR/migration-dry-run.txt" | awk '!seen[$0]++' | tr '\n' ' ' | sed 's/[[:space:]]*$//' || true)"
          if [ "$remote" = "$before" ]; then [ "$pending" = "$NEW_VERSION" ]; else [ -z "$pending" ]; fi
          [ "$(psql -Atqc "select value from public.osi_config where key='OSI_V2_CASE_WRITES_ENABLED'")" = true ]
          psql -Atq -F'|' -c "select key,md5(value) from public.osi_config where key<>'OSI_V2_CASE_WRITES_ENABLED' order by key" > "$PROOF_DIR/config-before.txt"
          psql -Atq -f scripts/protected-row-counts.sql | sort > "$PROOF_DIR/rows-before.txt"
          supabase functions list --project-ref "$EXPECTED_PROJECT_REF" -o json > "$PROOF_DIR/functions-before.json"
          jq '[.[]|select(.slug!="osi-v2-case-write")|{slug,version,status,verify_jwt,updated_at}]|sort_by(.slug)' "$PROOF_DIR/functions-before.json" > "$PROOF_DIR/non-task-before.json"
          jq -e '.[]|select(.slug=="osi-v2-case-write")' "$PROOF_DIR/functions-before.json" > "$PROOF_DIR/case-write-before.json"

      - name: Record forward-fix plan and contain only Case writes
        run: |
          set -euo pipefail
          printf '%s\n' 'Keep the additive migration and immutable data.' 'Hold only OSI_V2_CASE_WRITES_ENABLED=false.' 'Ship at most one focused forward-fix PR; never repair or drop migration history.' > "$PROOF_DIR/forward-fix-plan.txt"
          psql -v ON_ERROR_STOP=1 -c "update public.osi_config set value='false',updated_at=statement_timestamp() where key='OSI_V2_CASE_WRITES_ENABLED' and value='true'"
          [ "$(psql -Atqc "select value from public.osi_config where key='OSI_V2_CASE_WRITES_ENABLED'")" = false ]
          touch "$RUNNER_TEMP/case-writes-contained"

      - name: Apply only the approved migration and verify contract
        run: |
          set -euo pipefail
          if [ "$ROLLOUT_MODE" = deploy ]; then supabase db push --linked --yes; fi
          expected="$(echo "$AFTER_VERSIONS" | tr -s '[:space:]' ' ' | sed 's/^ //;s/ $//')"
          [ "$(psql -Atqc "select string_agg(version,' ' order by version) from supabase_migrations.schema_migrations")" = "$expected" ]
          psql -v ON_ERROR_STOP=1 -Atq > "$PROOF_DIR/case-contract.txt" <<'SQL'
          begin read only;
          select 'prepare_rejection|' || to_regprocedure('public.osi_v2_prepare_case_rejection(text,text,uuid,text,text)')::text;
          select 'commit_rejection|' || to_regprocedure('public.osi_v2_commit_case_rejection(text,text,text,timestamptz)')::text;
          select 'prepare_appeal|' || to_regprocedure('public.osi_v2_prepare_case_appeal(text,text,uuid,text,jsonb,text,text)')::text;
          select 'commit_appeal|' || to_regprocedure('public.osi_v2_commit_case_appeal(text,text,text,jsonb)')::text;
          select 'anon_denied|' || (not has_function_privilege('anon','public.osi_v2_prepare_case_appeal(text,text,uuid,text,jsonb,text,text)','execute'))::text;
          select 'auth_denied|' || (not has_function_privilege('authenticated','public.osi_v2_prepare_case_appeal(text,text,uuid,text,jsonb,text,text)','execute'))::text;
          select 'service_allowed|' || has_function_privilege('service_role','public.osi_v2_prepare_case_appeal(text,text,uuid,text,jsonb,text,text)','execute')::text;
          commit;
          SQL
          grep -Fxq 'anon_denied|true' "$PROOF_DIR/case-contract.txt"
          grep -Fxq 'auth_denied|true' "$PROOF_DIR/case-contract.txt"
          grep -Fxq 'service_allowed|true' "$PROOF_DIR/case-contract.txt"

      - name: Deploy exactly the Case write function and smoke while contained
        run: |
          set -euo pipefail
          supabase functions deploy "$FUNCTION_SLUG" --project-ref "$EXPECTED_PROJECT_REF" --no-verify-jwt --use-api
          base="https://${EXPECTED_PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_SLUG}"
          caps="$(curl -sS --fail --max-time 30 -X POST "$base" -H "Origin: ${PRODUCTION_WEB_URL}" -H 'Content-Type: application/json' -d '{"op":"actor_capabilities","wallet":"9xQeWvG816bUx9EPfEzjW5eC4oe9hMLxZQW6vMVnL8vS"}')"
          jq -e '.ok==true and .case_writes_enabled==false and .maintainer_access==false' <<< "$caps"
          code="$(curl -sS --max-time 30 -o "$PROOF_DIR/invalid-appeal.json" -w '%{http_code}' -X POST "$base" -H "Origin: ${PRODUCTION_WEB_URL}" -H 'Content-Type: application/json' -d '{"op":"prepare_appeal","wallet":"bad"}')"
          [ "$code" = 400 ]

      - name: Restore Case writes and verify isolation
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "update public.osi_config set value='true',updated_at=statement_timestamp() where key='OSI_V2_CASE_WRITES_ENABLED' and value='false'"
          [ "$(psql -Atqc "select value from public.osi_config where key='OSI_V2_CASE_WRITES_ENABLED'")" = true ]
          rm "$RUNNER_TEMP/case-writes-contained"
          base="https://${EXPECTED_PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_SLUG}"
          live="$(curl -sS --fail --max-time 30 -X POST "$base" -H "Origin: ${PRODUCTION_WEB_URL}" -H 'Content-Type: application/json' -d '{"op":"actor_capabilities","wallet":"9xQeWvG816bUx9EPfEzjW5eC4oe9hMLxZQW6vMVnL8vS"}')"
          jq -e '.ok==true and .case_writes_enabled==true and .maintainer_access==false' <<< "$live"
          psql -Atq -F'|' -c "select key,md5(value) from public.osi_config where key<>'OSI_V2_CASE_WRITES_ENABLED' order by key" > "$PROOF_DIR/config-after.txt"
          diff -u "$PROOF_DIR/config-before.txt" "$PROOF_DIR/config-after.txt"
          psql -Atq -f scripts/protected-row-counts.sql | sort > "$PROOF_DIR/rows-after.txt"
          diff -u "$PROOF_DIR/rows-before.txt" "$PROOF_DIR/rows-after.txt"
          supabase functions list --project-ref "$EXPECTED_PROJECT_REF" -o json > "$PROOF_DIR/functions-after.json"
          jq '[.[]|select(.slug!="osi-v2-case-write")|{slug,version,status,verify_jwt,updated_at}]|sort_by(.slug)' "$PROOF_DIR/functions-after.json" > "$PROOF_DIR/non-task-after.json"
          diff -u "$PROOF_DIR/non-task-before.json" "$PROOF_DIR/non-task-after.json"
          before="$(jq -r '.version' "$PROOF_DIR/case-write-before.json")"
          after="$(jq -r '.[]|select(.slug=="osi-v2-case-write")|.version' "$PROOF_DIR/functions-after.json")"
          [ "$after" -gt "$before" ]
          web_code="$(curl -sS --fail --max-time 30 -o "$PROOF_DIR/web-root.html" -w '%{http_code}' "$PRODUCTION_WEB_URL")"
          [ "$web_code" = 200 ]

      - name: Fail closed on rollout error
        if: failure()
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/case-writes-contained" ] || exit 0
          psql -v ON_ERROR_STOP=1 -c "update public.osi_config set value='false',updated_at=statement_timestamp() where key='OSI_V2_CASE_WRITES_ENABLED' and value<>'false'"
          echo '::error::Case writes remain disabled. Prepare one focused forward-fix PR.'

      - name: Upload sanitized production proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osi-case-rejection-appeal-${{ github.sha }}
          path: /tmp/osi-case-rejection-appeal-proof
          if-no-files-found: warn
          retention-days: 30
