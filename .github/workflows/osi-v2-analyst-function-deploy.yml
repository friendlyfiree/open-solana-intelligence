name: OSI V2 Analyst Function Deploy

# Manual, main-only deployment of exactly the osi-v2-analyst Edge Function.
# No migration is applied and no other function, secret or production surface
# is changed. A failed post-deploy smoke test disables only analyst writes.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-ANALYST-afibxpniwfnavdobecrn to authorize'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: osi-v2-analyst-function-deploy
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: afibxpniwfnavdobecrn
  FUNCTION_SLUG: osi-v2-analyst
  OSI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  validate:
    name: Clean analyst function validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require exact confirmation and current main
        run: |
          set -euo pipefail
          [ "${{ github.event.inputs.confirm }}" = "DEPLOY-ANALYST-${EXPECTED_PROJECT_REF}" ] || {
            echo "::error::Confirmation phrase mismatch."; exit 1;
          }
          [ "${GITHUB_REF}" = "refs/heads/main" ] || {
            echo "::error::Production deployment must be dispatched from main."; exit 1;
          }

      - name: Check out the dispatched commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify the dispatched commit is current origin/main
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo "::error::Dispatched commit is not current origin/main."; exit 1;
          }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Deno
        uses: denoland/setup-deno@909cc5acb0fdd60627fb858598759246509fa755 # v2.0.2
        with:
          deno-version: v2.4.1

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Complete application, authorization and UI tests
        run: |
          set -euo pipefail
          for test in tests/*.test.js tests/*.test.mjs; do node "$test"; done
          deno check "supabase/functions/${FUNCTION_SLUG}/index.ts"
          # Type-checking a graph is not evaluating it. A function that checks
          # cleanly can still throw on evaluation, and the Edge Runtime answers
          # every request to such a function with 500 WORKER_ERROR. Prove it
          # starts before this workflow is allowed to put it in front of users.
          bash tests/osi-edge-function-boot.test.sh

      - name: Start disposable PostgreSQL 17 and migrate from zero
        run: |
          set -euo pipefail
          supabase db start
          supabase db reset --local --no-seed

      - name: Database lint, pgTAP and replay tests
        run: |
          set -euo pipefail
          supabase db lint --local --level error
          supabase test db
          bash tests/osi-v2-concurrency.test.sh

      - name: Stop and discard the disposable database
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Deploy only the Analyst function and smoke test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID_SECRET: ${{ secrets.SUPABASE_PROJECT_ID }}
      PGSSLMODE: require
    steps:
      - name: Check out the exact validated main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify credentials, project and current main
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is absent."; exit 1; }
          [ -n "${SUPABASE_DB_PASSWORD:-}" ] || { echo "::error::SUPABASE_DB_PASSWORD is absent."; exit 1; }
          [ "$PROJECT_ID_SECRET" = "$EXPECTED_PROJECT_REF" ] || { echo "::error::Pinned project mismatch."; exit 1; }
          test -f "supabase/functions/${FUNCTION_SLUG}/index.ts"
          git fetch origin main --quiet
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || {
            echo "::error::Validated commit is no longer current main."; exit 1;
          }

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Resolve pinned session-pooler coordinates
        run: |
          set -euo pipefail
          response="$(curl -sS --fail --max-time 30 -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "https://api.supabase.com/v1/projects/${EXPECTED_PROJECT_REF}/config/database/pooler")"
          coordinates="$(printf '%s' "$response" | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          rows = data if isinstance(data, list) else [data]
          primary = next((r for r in rows if str(r.get("database_type", "")).upper() == "PRIMARY"), rows[0])
          print(primary["db_host"], primary["db_port"], primary["db_user"], primary.get("db_name", "postgres"))
          ')"
          read -r PGHOST PGPORT PGUSER PGDATABASE <<< "$coordinates"
          case "$PGHOST" in *.pooler.supabase.com) : ;; *) echo "::error::Unexpected pooler host."; exit 1 ;; esac
          [ "$PGUSER" = "postgres.${EXPECTED_PROJECT_REF}" ] || { echo "::error::Unexpected pooler user."; exit 1; }
          { echo "PGHOST=$PGHOST"; echo "PGPORT=$PGPORT"; echo "PGUSER=$PGUSER"; echo "PGDATABASE=$PGDATABASE"; } >> "$GITHUB_ENV"

      - name: Require exact synchronized migration history and no pending delta
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_PROJECT_REF"
          [ "$(cat supabase/.temp/project-ref)" = "$EXPECTED_PROJECT_REF" ]
          supabase migration list --linked
          local_versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | sed -E 's/^([0-9]{14}).*/\1/' | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          remote_versions="$(psql -Atqc "select coalesce(string_agg(version, ' ' order by version), '') from supabase_migrations.schema_migrations")"
          [ "$remote_versions" = "$local_versions" ] || { echo "::error::Production migration history is not synchronized with current main."; exit 1; }
          supabase db push --linked --dry-run 2>&1 | tee /tmp/db-dry-run.txt
          grep -Eqi 'up to date|no migrations' /tmp/db-dry-run.txt || { echo "::error::Dry-run did not prove zero pending migrations."; exit 1; }

      - name: Snapshot protected state and deployed functions
        run: |
          set -euo pipefail
          psql -Atq <<'SQL' > /tmp/state-before.txt
          begin read only;
          select 'analyst_writes|' || value from public.osi_config where key='OSI_V2_ANALYST_WRITES_ENABLED';
          select 'applications|' || count(*) from public.analyst_applications;
          select 'versions|' || count(*) from public.analyst_application_versions;
          select 'reviews|' || count(*) from public.analyst_application_reviews;
          select 'profiles|' || count(*) from public.analyst_profiles;
          commit;
          SQL
          grep -q '^analyst_writes|true$' /tmp/state-before.txt || { echo "::error::Analyst writes are not in the expected live state."; exit 1; }
          supabase functions list --project-ref "$EXPECTED_PROJECT_REF" -o json > /tmp/functions-before.json
          jq '[.[] | select(.slug!="osi-v2-analyst") | {slug,version,status,verify_jwt,updated_at}] | sort_by(.slug)' /tmp/functions-before.json > /tmp/non-task-before.json
          jq -e '.[] | select(.slug=="osi-v2-analyst")' /tmp/functions-before.json > /tmp/analyst-before.json

      - name: Record exact disable plan
        run: |
          echo "Failure containment changes only OSI_V2_ANALYST_WRITES_ENABLED to false."
          echo "Immutable applications, versions, reviews, profiles and receipts are retained."
          echo "Recovery is a focused forward-fix deployment followed by read-only smoke verification."

      - name: Deploy exactly the Analyst Edge Function
        run: |
          set -euo pipefail
          supabase functions deploy "$FUNCTION_SLUG" --project-ref "$EXPECTED_PROJECT_REF" --no-verify-jwt --use-api

      - name: Wait for the new deployment to answer
        run: |
          set -euo pipefail
          base="https://${EXPECTED_PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_SLUG}"
          # The smoke tests below used to run in the same second the deploy step
          # finished, so a deployment that had not finished coming up could be
          # read as a behavioural failure and disable a flag over a healthy
          # rollout. Readiness is established here, separately, using an
          # operation that touches no table: the dispatch default. A function
          # that is serving answers it 400; one that cannot boot answers 500.
          for attempt in $(seq 1 20); do
            code="$(curl -sS --max-time 20 -o /tmp/ready.json -w '%{http_code}' \
              -X POST "$base" -H 'Content-Type: application/json' \
              -d '{"op":"osi_deployment_readiness_probe"}' || echo 000)"
            if [ "$code" = "400" ]; then
              echo "Deployment answering after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code}; waiting."
            sleep 6
          done
          echo "::error::The deployed function never answered a dispatch-default request. It cannot boot; see the boot gate in validation."
          exit 1

      - name: Public privacy and deny-by-default smoke tests
        run: |
          set -euo pipefail
          base="https://${EXPECTED_PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_SLUG}"
          public_body="$(curl -sS --fail --max-time 30 -X POST "$base" -H 'Content-Type: application/json' -d '{"op":"list_public_profiles"}')"
          echo "$public_body" | grep -q '"ok":true' || { echo "::error::Public analyst directory failed."; exit 1; }
          if echo "$public_body" | grep -Eq 'details_restricted|payload_hash|nonce|signature|maintainer_auth_id'; then
            echo "::error::Public analyst DTO contains a restricted field."; exit 1;
          fi
          code="$(curl -sS --max-time 30 -o /tmp/bad-op.json -w '%{http_code}' -X POST "$base" -H 'Content-Type: application/json' -d '{"op":"definitely_not_an_op"}')"
          [ "$code" = "400" ] || { echo "::error::Unknown operation was not refused."; exit 1; }
          code="$(curl -sS --max-time 30 -o /tmp/bad-wallet.json -w '%{http_code}' -X POST "$base" -H 'Content-Type: application/json' -d '{"op":"prepare_application","wallet":"bad","application":{},"idempotency_key":"analyst-smoke-no-write"}')"
          [ "$code" = "400" ] || { echo "::error::Invalid wallet reached nonce issuance."; exit 1; }
          code="$(curl -sS --max-time 30 -o /tmp/queue.json -w '%{http_code}' -X POST "$base" -H 'Content-Type: application/json' -d '{"op":"issue_read_challenge","purpose":"ANALYST_READ_MAINTAINER_QUEUE","wallet":"9xQeWvG816bUx9EPfEzjW5eC4oe9hMLxZQW6vMVnL8vS"}')"
          [ "$code" = "403" ] || { echo "::error::Ordinary wallet reached the maintainer queue challenge."; exit 1; }

      - name: Verify task isolation and protected rows
        run: |
          set -euo pipefail
          psql -Atq <<'SQL' > /tmp/state-after.txt
          begin read only;
          select 'analyst_writes|' || value from public.osi_config where key='OSI_V2_ANALYST_WRITES_ENABLED';
          select 'applications|' || count(*) from public.analyst_applications;
          select 'versions|' || count(*) from public.analyst_application_versions;
          select 'reviews|' || count(*) from public.analyst_application_reviews;
          select 'profiles|' || count(*) from public.analyst_profiles;
          commit;
          SQL
          diff -u /tmp/state-before.txt /tmp/state-after.txt
          supabase functions list --project-ref "$EXPECTED_PROJECT_REF" -o json > /tmp/functions-after.json
          jq '[.[] | select(.slug!="osi-v2-analyst") | {slug,version,status,verify_jwt,updated_at}] | sort_by(.slug)' /tmp/functions-after.json > /tmp/non-task-after.json
          diff -u /tmp/non-task-before.json /tmp/non-task-after.json
          before="$(jq -r '.version' /tmp/analyst-before.json)"
          after="$(jq -r '.[] | select(.slug=="osi-v2-analyst") | .version' /tmp/functions-after.json)"
          [ "$after" -gt "$before" ] || { echo "::error::Analyst function version did not advance."; exit 1; }

      - name: Fail closed after a deployment or smoke failure
        if: failure()
        run: |
          set -euo pipefail
          if [ -z "${PGHOST:-}" ]; then
            echo "::error::Containment could not reach the pinned database; no production deployment had been authorized before coordinates were verified."
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -Atqc "update public.osi_config set value='false', updated_at=statement_timestamp() where key='OSI_V2_ANALYST_WRITES_ENABLED' and value is distinct from 'false';"
          echo "::error::Analyst writes were disabled fail-closed. Preserve immutable data and ship one focused forward fix."

      - name: Write deployment receipt
        run: |
          mkdir -p deployment-receipt
          {
            echo "project_ref=${EXPECTED_PROJECT_REF}"
            echo "commit=$(git rev-parse HEAD)"
            echo "function=${FUNCTION_SLUG}"
            echo "migration_delta=none"
            echo "analyst_writes=true"
          } > deployment-receipt/osi-v2-analyst-function.txt

      - name: Upload deployment receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osi-v2-analyst-function-${{ github.sha }}
          path: deployment-receipt/osi-v2-analyst-function.txt
          retention-days: 30
