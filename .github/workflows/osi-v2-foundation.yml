name: OSI V2 Foundation

# Validation gate for the OSI V2 foundation (additive schema, default-deny RLS,
# Stage-5 nonce/replay/receipt infrastructure). It runs entirely against a
# disposable local Supabase database. It never touches a production project:
# there are no secrets, no `supabase link`, and no linked-project commands.
# OSI_V2_WRITES_ENABLED and OSI_V2_PROOF_ENABLED remain false in committed config.

on:
  pull_request:
  workflow_dispatch:

# Least privilege: this gate only needs to read the checked-out code.
permissions:
  contents: read

# Cancel superseded runs for the same ref so only the latest commit is validated.
concurrency:
  group: osi-v2-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Stage-5 foundation validation
    runs-on: ubuntu-latest
    env:
      # Standard Supabase local database endpoint (see supabase/config.toml db.port).
      OSI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.4.1

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Show tool versions
        run: |
          node --version
          supabase --version
          psql --version

      - name: Dependency-free unit tests
        run: |
          # Every Node suite in tests/ runs, discovered by glob rather than
          # from a hand-maintained list. A list drifts silently: a suite added
          # in a later slice and never appended here simply stops existing as
          # far as CI is concerned, with nothing failing to say so. That is
          # exactly what happened, and it left the security-hardening, SAS
          # enforcement, Wire personal-data and i18n suites outside the gate
          # while the README claimed a full battery ran on every change. A
          # glob cannot drift.
          #
          # These suites are dependency-free by contract: no install step, no
          # database, no network. Anything that needs the local Supabase stack
          # belongs in the pgTAP and migration steps further down.
          shopt -s nullglob
          suites=(tests/*.test.mjs tests/*.test.js)
          if [ "${#suites[@]}" -lt 40 ]; then
            echo "::error::expected the full Node suite set, found ${#suites[@]}"
            exit 1
          fi
          echo "Running ${#suites[@]} dependency-free Node suites."
          failed=()
          for suite in "${suites[@]}"; do
            echo "::group::${suite}"
            if node "${suite}"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=${suite}::suite failed"
              failed+=("${suite}")
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "Failed suites: ${failed[*]}"
            exit 1
          fi
          echo "All ${#suites[@]} Node suites passed."

      - name: Deno type checks
        # These checks resolve remote dependencies from a third-party registry,
        # so a registry outage fails the check for a reason that has nothing to
        # do with the code under review. That is exactly what happened on
        # PR #133, where esm.sh answered 522 for `@solana/kit` and turned an
        # otherwise green pull request red. The production workflows already
        # solved this with a bounded retry; the pull-request gate did not have
        # it, which is the only reason a CDN blip could block a merge.
        #
        # The retry is bounded and never masks a real type error: a genuine
        # failure fails identically on all three attempts and the step still
        # exits non-zero.
        run: |
          set -euo pipefail
          deno_check_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if deno check "$@"; then return 0; fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Deno check failed after ${attempt} attempts."
                return 1
              fi
              echo "::warning::Deno dependency fetch/check failed; retrying (${attempt}/3)."
              sleep "$((attempt * 5))"
            done
          }
          deno_check_with_retry \
            supabase/functions/_shared/osi-v2-sas-core.mjs \
            supabase/functions/_shared/osi-v2-sas-onchain.ts \
            supabase/functions/_shared/osi-v2-sas-sdk.ts \
            supabase/functions/_shared/osi-v2-sas-issuer.ts \
            supabase/functions/osi-v2-case-read/index.ts \
            supabase/functions/osi-v2-case-write/index.ts \
            supabase/functions/osi-v2-analyst/index.ts \
            supabase/functions/osi-v2-report-read/index.ts \
            supabase/functions/osi-v2-report-write/index.ts \
            supabase/functions/osi-v2-governance-write/index.ts \
            supabase/functions/osi-v2-payment/index.ts \
            supabase/functions/osi-v2-proof/index.ts \
            supabase/functions/osi-v2-wire/index.ts \
            supabase/functions/osi-v2-ai-pack/index.ts \
            supabase/functions/_shared/osi-v2-read-session-core.mjs \
            supabase/functions/_shared/osi-v2-wire-core.mjs

      - name: Chromium UI contracts
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0 http-server@14.1.1
          npx playwright install --with-deps chromium
          npx playwright test --config tests/browser/playwright.config.js

      - name: Start disposable local database (PostgreSQL 17)
        run: supabase db start

      - name: Apply migrations from zero (no seed)
        run: supabase db reset --local --no-seed

      - name: Database lint (errors only)
        # The accepted legacy materialization functions create pg_temp tables
        # at runtime, which the static linter reports as absent. Keep those
        # results visible while matching the reviewed main-branch lint gate.
        run: supabase db lint --local --level error

      - name: pgTAP database tests
        run: supabase test db

      - name: Two-connection nonce concurrency and replay integration test
        run: bash tests/osi-v2-concurrency.test.sh

      - name: Always stop and discard the disposable database
        if: always()
        run: supabase stop --no-backup
