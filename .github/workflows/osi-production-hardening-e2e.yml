name: OSI Production Hardening E2E

# Manual, main-only resumable rollout for the exact payment recovery and legacy
# boundary migrations. The local job is disposable. Production performs one
# dry-run-approved additive forward fix, deploys only the payment gateway whose
# runtime behavior changed, runs read-only/negative smokes while payment remains
# disabled, and enables only that dedicated flag after every preceding gate.
# It creates no domain row or Solana transaction.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type HARDEN-E2E-afibxpniwfnavdobecrn to authorize"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: osi-production-hardening-e2e
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: afibxpniwfnavdobecrn
  PRODUCTION_WEB_URL: https://open-solana-intel.vercel.app
  NEW_VERSION: "20260728153100"
  BEFORE_VERSIONS: >-
    20260711092711 20260711092852 20260711092856 20260711182949
    20260712002518 20260712121301 20260713045903 20260713184533
    20260714044036 20260714064501 20260714082218 20260715053828
    20260715112621 20260716063000 20260716120000 20260718120000
    20260718130000 20260718140000 20260725120000 20260725140000
    20260726173000 20260726185457 20260726200249 20260727170000
    20260727173000 20260728132011
  AFTER_VERSIONS: >-
    20260711092711 20260711092852 20260711092856 20260711182949
    20260712002518 20260712121301 20260713045903 20260713184533
    20260714044036 20260714064501 20260714082218 20260715053828
    20260715112621 20260716063000 20260716120000 20260718120000
    20260718130000 20260718140000 20260725120000 20260725140000
    20260726173000 20260726185457 20260726200249 20260727170000
    20260727173000 20260728132011 20260728153100
  OSI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  validate:
    name: Disposable zero-to-latest authorization and browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Require exact confirmation and current main
        run: |
          set -euo pipefail
          [ "${{ github.event.inputs.confirm }}" = "HARDEN-E2E-${EXPECTED_PROJECT_REF}" ]
          [ "${GITHUB_REF}" = "refs/heads/main" ]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify exact current main commit
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.4.1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.110.0

      - name: Full application, registry, payment, and type battery
        run: |
          set -euo pipefail
          for test in tests/*.test.js tests/*.test.mjs; do node "$test"; done
          mapfile -t deno_sources < <(
            find supabase/functions -type f \( -path '*/index.ts' -o -path '*/_shared/*.ts' -o -path '*/_shared/*.mjs' \) | sort
          )
          deno check "${deno_sources[@]}" tests/osi-core-flow-production-smoke.mjs

      - name: Chromium end-to-end UI contracts
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @playwright/test@1.55.0 http-server@14.1.1
          npx playwright install --with-deps chromium
          npx playwright test --config tests/browser/playwright.config.js

      - name: Fresh PostgreSQL 17 migration, lint, behavioral pgTAP, and races
        run: |
          set -euo pipefail
          supabase db start
          supabase db reset --local --no-seed
          got="$(psql "$OSI_TEST_DATABASE_URL" -Atqc "select string_agg(version, ' ' order by version) from supabase_migrations.schema_migrations")"
          expected="$(echo "$AFTER_VERSIONS" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')"
          [ "$got" = "$expected" ]
          supabase db lint --local --level error
          supabase test db
          bash tests/osi-v2-concurrency.test.sh

      - name: Stop and discard disposable local database
        if: always()
        run: supabase stop --no-backup

  migrate-deploy-smoke:
    name: Exact migration, payment deploy, and production proof
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID_SECRET: ${{ secrets.SUPABASE_PROJECT_ID }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.110.0

      - name: Verify credentials, project, and unchanged main
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]
          [ -n "${SUPABASE_DB_PASSWORD:-}" ]
          [ "$PROJECT_ID_SECRET" = "$EXPECTED_PROJECT_REF" ]
          git fetch origin main --quiet
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]

      - name: Resolve pinned session-pooler coordinates
        run: |
          set -euo pipefail
          response="$(curl -sS --fail --max-time 30 -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${EXPECTED_PROJECT_REF}/config/database/pooler")"
          coordinates="$(printf '%s' "$response" | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          rows = data if isinstance(data, list) else [data]
          primary = next((r for r in rows if str(r.get("database_type", "")).upper() == "PRIMARY"), rows[0])
          print(primary["db_host"], primary["db_port"], primary["db_user"], primary.get("db_name", "postgres"))
          ')"
          read -r PGHOST PGPORT PGUSER PGDATABASE <<< "$coordinates"
          case "$PGHOST" in *.pooler.supabase.com) : ;; *) exit 1 ;; esac
          [ "$PGUSER" = "postgres.${EXPECTED_PROJECT_REF}" ]
          { echo "PGHOST=$PGHOST"; echo "PGPORT=$PGPORT"; echo "PGUSER=$PGUSER"; echo "PGDATABASE=$PGDATABASE"; } >> "$GITHUB_ENV"

      - name: Snapshot feature flags and protected row counts
        run: |
          set -euo pipefail
          [ "$(psql -Atqc "select value from public.osi_config where key='OSI_V2_PAYMENT_WRITES_ENABLED'")" = "false" ]
          psql -v ON_ERROR_STOP=1 -Atq -F'|' \
            -c "select key, encode(convert_to(value, 'UTF8'), 'base64') from public.osi_config where key<>'OSI_V2_PAYMENT_WRITES_ENABLED' order by key" \
            > /tmp/config-before.txt
          psql -v ON_ERROR_STOP=1 -Atq -F'|' -f - > /tmp/rows-before.txt <<'SQL'
          begin read only;
          select relation_name || '|' || row_count from (
            select 'analyst_applications' relation_name,count(*) row_count from public.analyst_applications
            union all select 'analyst_profiles',count(*) from public.analyst_profiles
            union all select 'case_report_reviews',count(*) from public.case_report_reviews
            union all select 'case_reports',count(*) from public.case_reports
            union all select 'case_resolutions',count(*) from public.case_resolutions
            union all select 'cases',count(*) from public.cases
            union all select 'challenges_v2',count(*) from public.challenges_v2
            union all select 'event_receipts',count(*) from public.event_receipts
            union all select 'osi_nonces',count(*) from public.osi_nonces
            union all select 'reward_payments',count(*) from public.reward_payments
            union all select 'reward_pledges',count(*) from public.reward_pledges
            union all select 'support_events',count(*) from public.support_events
            union all select 'wire_report_reviews',count(*) from public.wire_report_reviews
            union all select 'wire_reports',count(*) from public.wire_reports
            union all select 'legacy_onchain_events',count(*) from public.onchain_events
            union all select 'legacy_requests',count(*) from public.requests
            union all select 'storage_objects',count(*) from storage.objects
          ) counts order by relation_name;
          commit;
          SQL

      - name: Link and require exact resumable history
        run: |
          set -euo pipefail
          supabase link --project-ref "$EXPECTED_PROJECT_REF"
          [ "$(cat supabase/.temp/project-ref)" = "$EXPECTED_PROJECT_REF" ]
          got="$(psql -Atqc "select string_agg(version, ' ' order by version) from supabase_migrations.schema_migrations")"
          before="$(echo "$BEFORE_VERSIONS" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')"
          after="$(echo "$AFTER_VERSIONS" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')"
          if [ "$got" = "$before" ]; then
            echo "MIGRATION_PENDING=true" >> "$GITHUB_ENV"
          elif [ "$got" = "$after" ]; then
            echo "MIGRATION_PENDING=false" >> "$GITHUB_ENV"
          else
            echo "::error::Production history is not the exact before or resumed state."
            exit 1
          fi

      - name: Record forward-fix and disable plan
        run: |
          echo "Additive policies/functions remain in place for a focused forward fix."
          echo "If payment rollout verification fails, disable only OSI_V2_PAYMENT_WRITES_ENABLED."
          echo "No table drop, data delete, migration repair, or history rewrite is permitted."

      - name: Dry-run exactly the approved migration
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run 2>&1 | tee /tmp/hardening-dry-run.txt
          versions="$(grep -oE '20[0-9]{12}' /tmp/hardening-dry-run.txt || true)"
          got="$(printf '%s\n' "$versions" | awk '!seen[$0]++' | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          if [ "$MIGRATION_PENDING" = "true" ]; then
            [ "$got" = "$NEW_VERSION" ]
          else
            [ -z "$got" ]
            grep -Fq 'Remote database is up to date.' /tmp/hardening-dry-run.txt
          fi

      - name: Apply exactly the dry-run-approved additive migration
        if: env.MIGRATION_PENDING == 'true'
        run: supabase db push --linked --yes

      - name: Verify history, semantic policy boundary, storage, and RPC grants
        run: |
          set -euo pipefail
          expected="$(echo "$AFTER_VERSIONS" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')"
          [ "$(psql -Atqc "select string_agg(version, ' ' order by version) from supabase_migrations.schema_migrations")" = "$expected" ]
          psql -v ON_ERROR_STOP=1 -Atq <<'SQL'
          do $$
          begin
            if exists (
              select 1 from pg_policies
               where schemaname='public' and tablename='onchain_events' and cmd<>'SELECT'
            ) then raise exception 'legacy onchain write policy survived'; end if;
            if exists (
              select 1 from pg_policies
               where schemaname='public' and tablename='requests'
                 and (cmd<>'SELECT' or qual is distinct from '(approved IS TRUE)')
            ) then raise exception 'unsafe request policy survived'; end if;
            if exists (
              select 1 from pg_policies
               where schemaname='storage' and tablename='objects'
                 and policyname in ('osi storage upload','osi storage read')
            ) then raise exception 'osi-uploads upload or listing policy survived'; end if;
            if has_table_privilege('anon','public.onchain_events','INSERT')
               or has_table_privilege('authenticated','public.requests','INSERT')
               or has_table_privilege('authenticated','public.requests','UPDATE')
               or has_table_privilege('authenticated','public.requests','DELETE')
              then raise exception 'legacy browser write privilege survived'; end if;
            if has_function_privilege('anon',
                 'public.osi_v2_recover_payment(text,text,bigint,timestamptz,text,jsonb)','EXECUTE')
               or has_function_privilege('authenticated',
                 'public.osi_v2_recover_payment(text,text,bigint,timestamptz,text,jsonb)','EXECUTE')
               or not has_function_privilege('service_role',
                 'public.osi_v2_recover_payment(text,text,bigint,timestamptz,text,jsonb)','EXECUTE')
              then raise exception 'payment recovery execute boundary is wrong'; end if;
            if exists (
              select 1 from pg_proc proc
              join pg_namespace ns on ns.oid=proc.pronamespace
              where ns.nspname in ('public','osi_private') and proc.prosecdef
                and (
                  has_function_privilege('anon',proc.oid,'EXECUTE')
                  or has_function_privilege('authenticated',proc.oid,'EXECUTE')
                )
            ) then raise exception 'browser-reachable SECURITY DEFINER function found'; end if;
            if not exists (
              select 1 from storage.buckets
               where id='osi-uploads' and public=true
            ) then raise exception 'historical public object URL bucket changed'; end if;
            if not exists (
              select 1 from storage.buckets
               where id='osi-analyst-avatars' and public=true
            ) then raise exception 'avatar public-fetch model changed'; end if;
          end $$;
          SQL

      - name: Deploy only the changed payment Edge Function
        run: |
          set -euo pipefail
          supabase functions deploy osi-v2-payment --project-ref "$EXPECTED_PROJECT_REF" --no-verify-jwt --use-api
          functions="$(supabase functions list --project-ref "$EXPECTED_PROJECT_REF")"
          [[ "$functions" == *"osi-v2-payment"* ]]

      - name: Production anon, storage, and disabled-payment negative smoke
        run: |
          set -euo pipefail
          key="$(sed -n 's/^window.OSI_SUPABASE_KEY = "\(.*\)";$/\1/p' assets/js/01-public-config.js)"
          [ -n "$key" ]
          api="https://${EXPECTED_PROJECT_REF}.supabase.co"
          headers=(-H "apikey: ${key}" -H "Authorization: Bearer ${key}" -H 'Content-Type: application/json')

          code="$(curl -sS --max-time 30 -o /tmp/request-insert.json -w '%{http_code}' \
            -X POST "${api}/rest/v1/requests" "${headers[@]}" \
            -d '{"id":"OSI-NEGATIVE-SMOKE","name":"must not insert","approved":false}')"
          [ "$code" = "401" ] || [ "$code" = "403" ]
          code="$(curl -sS --max-time 30 -o /tmp/onchain-insert.json -w '%{http_code}' \
            -X POST "${api}/rest/v1/onchain_events" "${headers[@]}" \
            -d '{"event_type":"FAKE","tx_sig":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}')"
          [ "$code" = "401" ] || [ "$code" = "403" ]
          code="$(curl -sS --max-time 30 -o /tmp/storage-upload.json -w '%{http_code}' \
            -X POST "${api}/storage/v1/object/osi-uploads/negative-smoke.txt" \
            -H "apikey: ${key}" -H "Authorization: Bearer ${key}" \
            -H 'Content-Type: text/plain' --data-binary 'must not upload')"
          [ "$code" != "200" ] && [ "$code" != "201" ]
          code="$(curl -sS --max-time 30 -o /tmp/storage-list.json -w '%{http_code}' \
            -X POST "${api}/storage/v1/object/list/osi-uploads" \
            -H "apikey: ${key}" -H "Authorization: Bearer ${key}" \
            -H 'Content-Type: application/json' -d '{"prefix":"","limit":1,"offset":0}')"
          [ "$code" = "200" ]
          [ "$(tr -d '[:space:]' < /tmp/storage-list.json)" = "[]" ]
          curl -sS --fail --max-time 30 -o /tmp/requests-read.json \
            "${api}/rest/v1/requests?select=id,approved" "${headers[@]}"
          if grep -q '"approved":false' /tmp/requests-read.json; then
            echo "::error::Pending request leaked to anonymous read."
            exit 1
          fi

          payment="${api}/functions/v1/osi-v2-payment"
          capability="$(curl -sS --fail --max-time 30 -X POST "$payment" "${headers[@]}" \
            -d '{"op":"capabilities","wallet":"11111111111111111111111111111112"}')"
          grep -q '"payment_writes_enabled":false' <<<"$capability"

      - name: Verify exact Vercel frontend hardening
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if frontend="$(curl -sS --fail --max-time 30 \
              "${PRODUCTION_WEB_URL}/assets/js/v2-case-integration.js?commit=${GITHUB_SHA}")"; then
              if [[ "$frontend" == *"Re-verify existing signature"* ]] \
                 && [[ "$frontend" == *"osi:v2:payment-recovery:1"* ]]; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Vercel production did not reach the exact merged hardening UI."
          exit 1

      - name: Prove non-payment flags and every protected row count unchanged
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atq -F'|' \
            -c "select key, encode(convert_to(value, 'UTF8'), 'base64') from public.osi_config where key<>'OSI_V2_PAYMENT_WRITES_ENABLED' order by key" \
            > /tmp/config-after.txt
          diff -u /tmp/config-before.txt /tmp/config-after.txt
          psql -v ON_ERROR_STOP=1 -Atq -F'|' -f - > /tmp/rows-after.txt <<'SQL'
          begin read only;
          select relation_name || '|' || row_count from (
            select 'analyst_applications' relation_name,count(*) row_count from public.analyst_applications
            union all select 'analyst_profiles',count(*) from public.analyst_profiles
            union all select 'case_report_reviews',count(*) from public.case_report_reviews
            union all select 'case_reports',count(*) from public.case_reports
            union all select 'case_resolutions',count(*) from public.case_resolutions
            union all select 'cases',count(*) from public.cases
            union all select 'challenges_v2',count(*) from public.challenges_v2
            union all select 'event_receipts',count(*) from public.event_receipts
            union all select 'osi_nonces',count(*) from public.osi_nonces
            union all select 'reward_payments',count(*) from public.reward_payments
            union all select 'reward_pledges',count(*) from public.reward_pledges
            union all select 'support_events',count(*) from public.support_events
            union all select 'wire_report_reviews',count(*) from public.wire_report_reviews
            union all select 'wire_reports',count(*) from public.wire_reports
            union all select 'legacy_onchain_events',count(*) from public.onchain_events
            union all select 'legacy_requests',count(*) from public.requests
            union all select 'storage_objects',count(*) from storage.objects
          ) counts order by relation_name;
          commit;
          SQL
          diff -u /tmp/rows-before.txt /tmp/rows-after.txt

      - name: Enable only payment and run final negative smoke
        run: |
          set -euo pipefail
          [ "$(psql -Atqc "
            with changed as (
              update public.osi_config
                 set value='true',updated_at=statement_timestamp()
               where key='OSI_V2_PAYMENT_WRITES_ENABLED' and value='false'
               returning 1
            ) select count(*) from changed;")" = "1" ]
          [ "$(psql -Atqc "select value from public.osi_config where key='OSI_V2_PAYMENT_WRITES_ENABLED'")" = "true" ]

          key="$(sed -n 's/^window.OSI_SUPABASE_KEY = "\(.*\)";$/\1/p' assets/js/01-public-config.js)"
          api="https://${EXPECTED_PROJECT_REF}.supabase.co"
          headers=(-H "apikey: ${key}" -H "Authorization: Bearer ${key}" -H 'Content-Type: application/json')
          payment="${api}/functions/v1/osi-v2-payment"
          capability="$(curl -sS --fail --max-time 30 -X POST "$payment" "${headers[@]}" \
            -d '{"op":"capabilities","wallet":"11111111111111111111111111111112"}')"
          grep -q '"payment_writes_enabled":true' <<<"$capability"
          code="$(curl -sS --max-time 30 -o /tmp/payment-negative.json -w '%{http_code}' \
            -X POST "$payment" "${headers[@]}" \
            -d '{"op":"recover_payment","wallet":"11111111111111111111111111111112","nonce":"bad","tx_sig":"bad"}')"
          [ "$code" = "400" ] || [ "$code" = "409" ]

          psql -v ON_ERROR_STOP=1 -Atq -F'|' -f - > /tmp/rows-after-enable.txt <<'SQL'
          begin read only;
          select relation_name || '|' || row_count from (
            select 'analyst_applications' relation_name,count(*) row_count from public.analyst_applications
            union all select 'analyst_profiles',count(*) from public.analyst_profiles
            union all select 'case_report_reviews',count(*) from public.case_report_reviews
            union all select 'case_reports',count(*) from public.case_reports
            union all select 'case_resolutions',count(*) from public.case_resolutions
            union all select 'cases',count(*) from public.cases
            union all select 'challenges_v2',count(*) from public.challenges_v2
            union all select 'event_receipts',count(*) from public.event_receipts
            union all select 'osi_nonces',count(*) from public.osi_nonces
            union all select 'reward_payments',count(*) from public.reward_payments
            union all select 'reward_pledges',count(*) from public.reward_pledges
            union all select 'support_events',count(*) from public.support_events
            union all select 'wire_report_reviews',count(*) from public.wire_report_reviews
            union all select 'wire_reports',count(*) from public.wire_reports
            union all select 'legacy_onchain_events',count(*) from public.onchain_events
            union all select 'legacy_requests',count(*) from public.requests
            union all select 'storage_objects',count(*) from storage.objects
          ) counts order by relation_name;
          commit;
          SQL
          diff -u /tmp/rows-before.txt /tmp/rows-after-enable.txt

      - name: Fail payment closed after a rollout or smoke failure
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          if [ -z "${PGHOST:-}" ] || [ -z "${PGUSER:-}" ]; then
            echo "No production database session was established."
            exit 0
          fi
          psql -v ON_ERROR_STOP=1 -Atq -c "
            update public.osi_config
               set value='false',updated_at=statement_timestamp()
             where key='OSI_V2_PAYMENT_WRITES_ENABLED' and value='true';"
          [ "$(psql -Atqc "select value from public.osi_config where key='OSI_V2_PAYMENT_WRITES_ENABLED'")" = "false" ]
          echo "Payment writes disabled; immutable data retained for one focused forward fix."

      - name: Write deployment receipt
        run: |
          mkdir -p deployment-receipt
          {
            echo "project_ref=${EXPECTED_PROJECT_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "migration=${NEW_VERSION}"
            echo "migration_was_pending=${MIGRATION_PENDING}"
            echo "edge_function=osi-v2-payment"
            echo "feature_flags=payment_false_to_true_only"
            echo "production_domain_rows=unchanged"
            echo "solana_transactions_created=0"
            echo "vercel_recovery_ui_verified=true"
            echo "rollback=disable_payment_flag_and_forward_fix"
          } > deployment-receipt/osi-production-hardening-e2e.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osi-production-hardening-e2e-${{ github.sha }}
          path: deployment-receipt/osi-production-hardening-e2e.txt
          retention-days: 30
